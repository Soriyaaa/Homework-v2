<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <link rel="stylesheet" href="style-HW.css">
    
    
    


<!--Header-->
<body>
    
        <div class="header">
            <h1>Student Practise Webpage</h1>
            <h5>HTML + CSS Practise (Form + Table Advancement)</h5>
        </div>
   

<!--Image1-square-->  
        <div class="image-section">
            <h4>Image Section</h4>
            <img id="osaka-travel-place" src="https://i.pinimg.com/1200x/0b/55/c5/0b55c5b5cbaf688044ef0433cdc566f8.jpg" alt="width=150" height="150">
        </div>
<!--Image2-circle-->  
        <div class="Image-circle">
        <div class="circle-container">
            <h4>Image Circle</h4>
            <img id="Osaka Travel place" src="https://i.pinimg.com/1200x/0b/55/c5/0b55c5b5cbaf688044ef0433cdc566f8.jpg" alt="width=150" height="150">
        </div>
        </div>

<!--Image3-oval-->
    <div class="Image-oval">
          
        <div class="oval-border">
        <h4>Image Oval</h4> 
        <img id="osaka-travel-place" src="https://i.pinimg.com/1200x/0b/55/c5/0b55c5b5cbaf688044ef0433cdc566f8.jpg" alt="width=150" height="150"> 
    </div> 
    </div>

        <!--Table-->
            <div class="table">
                <h4>Advanced Table</h4>
        
                <table width="1000" border="1" cellspacing="0" cellpadding="8"> 
                <tr>
                <th rowspan="2">Name</th>
                <th colspan="2">Scores</th>
                <th rowspan="2">Grade</th>        
            </tr>
       
        <tr>
            <th>Math</th>
            <th>CS</th>
        </tr>

        <tr align ="center">
            <td>Alice</td>
            <td>90</td>
            <td>95</td>
            <td>A</td>
        </tr>
    <br>
        <tr align ="center">
            <td>Bob</td>
            <td>80</td>
            <td>85</td>
            <td>B</td>
        </tr>
    </table>
    <br>
    </div>

<!--Form1-->

<div class="form1" align="center">
    <h3>Form 1: Basic Info</h3>
    <form>
<div class="form-group">
    <label for="name"><b>Name</b> <span class=required>*</span></label><br>
    <input type="text" id="name" name="name">
    </div>

<div class="form-group">
    <label for="email"><b>Email</b> <span class=required>*</span></label><br>
    <input type="text" id="email" emial="email">
    </div>
<div class="form-group">
    <label for="password"><b>Password</b> <span class=required>*</span></label><br>
    <input type="text" id="password" password="pword">
    </div>

    <label for="file-upload"><b>Upload File</b></label><br>
<div class= "box">
        <input type="file" id="file-upload" name="file-upload">
    </div>


<div class="button-group" align="center">
    <button type="submit" class="btn-blue">Submit</button>
    <button type="reset" class="btn-blue">Reset</button>
  </div>
</div>

<!--Form2-->
    <div class="form2" align="center">
    </form>

    <h3>Form 2: Survey Form</h3>

    <div class="form-group">
    <label for="course"><b>Choose Course</b> <span class="required">*</span></label>
    <br>
    <select id="course" name="course" class="custom-select">
        <option value="" disabled selected>-- Select --</option>
        <option value="math">Digital marketing</option>
        <option value="cs">Computer Science</option>
        <option value="art">Content creator</option>
    </select>
    </div>

<!--group-from2-->
<div class="group-form2">
    <h4>Gender</h4>
    <div class="option">
        <input type="radio" id="female" value="female">
        <label for="female">Female</label>
        <input type="radio" id="male" value="Male">
        <label for="male">Male</label>
    </div>
</div>

<div class="group-form2">
    <h4>Skills</h4>
    <div class="option">
    <input type="checkbox" name= HTML id="HTML" placeholder="checkbox">
    <label for="html">HTML</label>
    <input type="checkbox" name="CSS" id="CSS" placeholder="checkbox">
    <label for="css">CSS</label>
    <input type="checkbox" name="js" id="js">
    <label for="js">JS</label><br>
    </div>
</div>

<label for="phone"><b>Phone</b></label><br>
<input type="text" name="phone" id="phone"><br>

<!--message-->
<label for="message"><b>Message</b></label><br>
<textarea name="message" id="message"></textarea><br>
<button>Submit</button>
</div>






</body>
</html>
